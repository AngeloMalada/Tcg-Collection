name: Build Release APK

on:
  push:
    branches:
      - "release/**"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Sign release APK
        id: prepare
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION_TAG="${BRANCH_NAME#release/}"
          VERSION_TAG="${VERSION_TAG#release-}"
          SAFE_TAG=$(echo "$VERSION_TAG" | tr '/ ' '--')

          # Unsigned APKs cannot be installed, so never publish one.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p dist/release dist/debug
          cp app/build/outputs/apk/debug/app-debug.apk "dist/debug/TCG-Collection-Tracker-${SAFE_TAG}-debug.apk"

          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "dist/release/TCG-Collection-Tracker-${SAFE_TAG}.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f release.keystore
          "$APKSIGNER" verify --print-certs "dist/release/TCG-Collection-Tracker-${SAFE_TAG}.apk"

          echo "tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcg-collection-tracker-${{ steps.prepare.outputs.tag }}-apk
          path: dist/**/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TCG Collection Tracker ${{ steps.prepare.outputs.tag }}
          generate_release_notes: true
          # Only the signed APK: the in-app updater downloads the first .apk it finds.
          files: dist/release/*.apk
