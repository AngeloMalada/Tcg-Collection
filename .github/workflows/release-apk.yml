name: Build Release APK

on:
  push:
    branches:
      - "release/**"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APK artifacts
        id: prepare
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION_TAG="${BRANCH_NAME#release/}"
          VERSION_TAG="${VERSION_TAG#release-}"
          SAFE_TAG=$(echo "$VERSION_TAG" | tr '/ ' '--')

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/tcgvault-${SAFE_TAG}-debug.apk"

          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            "$APKSIGNER" sign \
              --ks release.keystore \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "dist/tcgvault-${SAFE_TAG}-release.apk" \
              "$RELEASE_APK"
            rm -f release.keystore
          else
            cp "$RELEASE_APK" "dist/tcgvault-${SAFE_TAG}-release-unsigned.apk"
          fi

          echo "tag=${SAFE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcgvault-${{ steps.prepare.outputs.tag }}-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/release-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: TCG Vault ${{ steps.prepare.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
